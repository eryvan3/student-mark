    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif; 
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0e10;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 8px;
        }
        .main-card {
            width: 100%;
            height: 100%;
            background: #1e2022;
            border: 2px solid #00a896;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(0, 168, 150, 0.2);
            display: flex;
            flex-direction: column;
        }

        /* بەشێ سەری (Header) */
        .header-box {
            background: #ffc107;
            color: #000000;
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .main-title { font-size: 14px; font-weight: 900; }
        .teacher-badge {
            background: #000000;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 2px 12px;
            border-radius: 15px;
        }
        .sub-title { font-size: 12px; font-weight: 800; }
        .blessing { font-size: 12px; font-weight: 900; color: #121315; }

        /* شاشێن مامۆستایان */
        .teacher-screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            height: 100%;
            flex-direction: column;
        }
        .teacher-screen.active {
            display: flex;
            opacity: 1;
        }

        /* بەشێ تۆڕا ناڤان (Grid) */
        .grid-container {
            display: grid;
            gap: 3px 6px;
            flex-grow: 1;
            align-content: stretch;
            height: calc(100% - 50px);
        }

        /* شاشا عمر: 72 ناڤ ل سەر 3 ستوونان دبنە 24 ڕێز */
        #gridOmar {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(24, minmax(0, 1fr));
            grid-auto-flow: column;
        }

        /* شاشا پەروەر: 101 ناڤ ل سەر 4 ستوونان دبنە 26 ڕێز */
        #gridParwar {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(26, minmax(0, 1fr));
            grid-auto-flow: column;
        }

        .student-row {
            background: #2a2c30;
            border: 1px solid #383b42;
            padding: 0 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            background: #00bfa5;
            color: #000000;
            padding: 0 5px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 900;
            margin-right: 4px;
        }
    </style>
</head>
