<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایشکرنا ڤیدیۆیی یا نمرێن قوتابییان</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&family=Outfit:wght@700;800;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #090c10, #131924, #0b1f28, #150f21);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            overflow: hidden;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .main-card {
            width: 100%;
            height: 100%;
            background: rgba(15, 21, 33, 0.72);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 230, 195, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 230, 195, 0.08);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-box {
            background: linear-gradient(90deg, rgba(255, 152, 0, 0.28), rgba(0, 230, 195, 0.2));
            border: 1px solid rgba(255, 152, 0, 0.5);
            border-radius: 12px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            margin-bottom: 10px;
            animation: pulseHeader 4s infinite alternate;
        }

        @keyframes pulseHeader {
            0% { box-shadow: 0 0 12px rgba(255, 152, 0, 0.25); }
            100% { box-shadow: 0 0 28px rgba(0, 230, 195, 0.45); }
        }

        .main-title {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            line-height: 1.2;
        }

        .teacher-badge {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            padding: 6px 24px;
            border-radius: 22px;
            box-shadow: 0 0 14px rgba(255, 152, 0, 0.5);
            white-space: nowrap;
        }

        .teacher-screen {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            pointer-events: none;
        }

        .teacher-screen.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(18, 1fr);
            grid-auto-flow: column;
            gap: 4px 10px;
            height: calc(100% - 74px);
            width: 100%;
        }

        .student-row {
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 0 0 0 6px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 21px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            height: 100%;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.3s ease;
        }

        .teacher-screen.active .student-row {
            animation: slideUp 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
            padding-right: 4px;
            flex-grow: 1;
        }

        .student-index {
            color: #ffca28;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 800;
            min-width: 28px;
        }

        .student-name {
            color: #f8fafc;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 800;
            letter-spacing: 0;
        }

        .score-column {
            background: linear-gradient(135deg, #00e6c3, #00b39b);
            color: #031412;
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 900;
            height: 100%;
            min-width: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            box-shadow: -2px 0 10px rgba(0, 230, 195, 0.35);
        }

        .progress-bar-container {
            position: absolute;
            bottom: 4px;
            left: 12px;
            right: 12px;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9800, #00e6c3);
            border-radius: 3px;
        }

        .progress-bar.running {
            animation: progressAnim 10s linear infinite;
        }

        @keyframes progressAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>

    function renderList(students, grid) {
        grid.innerHTML = '';
        students.forEach((st, i) => {
            const row = document.createElement('div');
            row.className = 'student-row';
            row.style.animationDelay = `${(i % 18) * 0.02}s`;
            row.innerHTML = `
                <div class="student-info">
                    <span class="student-index">${i + 1}.</span>
                    <span class="student-name">${st.name}</span>
                </div>
                <div class="score-column">${st.score}</div>
            `;
            grid.appendChild(row);
        });
    }

    const mainCard = document.getElementById('mainCard');
    const progressBarContainer = document.querySelector('.progress-bar-container');
    const allScreens = [];

    teachersData.forEach(teacher => {
        const screen = document.createElement('div');
        screen.className = 'teacher-screen';
        screen.innerHTML = `
            <div class="header-box">
                <div class="main-title">${teacher.title}</div>
                <div class="teacher-badge">${teacher.badge}</div>
            </div>
            <div class="grid-container"></div>
        `;
        mainCard.insertBefore(screen, progressBarContainer);
        const grid = screen.querySelector('.grid-container');
        renderList(teacher.students, grid);
        allScreens.push(screen);
    });

    if (allScreens.length > 0) {
        allScreens[0].classList.add('active');
    }

    const progressBar = document.getElementById('progressBar');
    let currentScreen = 0;

    function resetProgressBar() {
        progressBar.classList.remove('running');
        void progressBar.offsetWidth;
        progressBar.classList.add('running');
    }

    setInterval(() => {
        allScreens[currentScreen].classList.remove('active');
        currentScreen = (currentScreen + 1) % allScreens.length;
        allScreens[currentScreen].classList.add('active');
        resetProgressBar();
    }, 10000);
