<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشا نمرێن قوتابیان - وانەیا عەرەبی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .header p {
            font-size: 1.4rem;
            color: #94a3b8;
        }

        .fullscreen-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .fullscreen-btn:hover {
            background-color: #0369a1;
            transform: scale(1.05);
        }

        .table-container {
            width: 95%;
            max-width: 1200px;
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead {
            background-color: #0284c7;
            color: #ffffff;
        }

        th, td {
            padding: 18px 15px;
            font-size: 1.4rem;
            border-bottom: 1px solid #334155;
        }

        th {
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        tbody tr:nth-child(even) {
            background-color: #1a2332;
        }

        tbody tr:hover {
            background-color: #334155;
            transition: 0.2s;
        }

        .mark {
            font-weight: bold;
            color: #4ade80;
        }

        .mark.low {
            color: #f87171;
        }
    </style>
</head>
<body onclick="enableFullScreen()">

    <div class="header">
        <h1>شاشا نمرێن قوتابیان - وانەیا عەرەبی</h1>
        <p>نمرێن کورتەیی یێن قوتابییان</p>
    </div>

    <button class="fullscreen-btn" onclick="toggleFullScreen()">🖥️ شاشا تەمام (Full Screen)</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>ناوێ قوتابی</th>
                    <th>وانە</th>
                    <th>نمرە</th>
                    <th>ئاست</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>ئەحمەد هەڤال</td>
                    <td>اللغة العربية</td>
                    <td class="mark">95</td>
                    <td>ممتاز</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>سارا ئازاد</td>
                    <td>اللغة العربية</td>
                    <td class="mark">88</td>
                    <td>جيد جداً</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>دیار کاروان</td>
                    <td>اللغة العربية</td>
                    <td class="mark">92</td>
                    <td>ممتاز</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>لانا سەباح</td>
                    <td>اللغة العربية</td>
                    <td class="mark">78</td>
                    <td>جيد</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>یوسف بێوار</td>
                    <td>اللغة العربية</td>
                    <td class="mark low">45</td>
                    <td>راسب</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // هەوڵدان بۆ ئۆتۆماتیکی Fullscreen دەمێ ل سەر هەر جهەکێ شاشێ دا بپێژی
        function enableFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen restriction: Click button manually");
                });
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
