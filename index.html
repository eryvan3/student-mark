<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- پەیام بۆ شاشا تەلەڤزیۆنێ دا کو ب تەواوی پڕی شاشەیی ببت بێی ڕاگرتن -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شاشا نمایشکرنا نمرێن قوتابییان - TV</title>
    
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Dubai', 'Segoe UI', Tahoma, Arial, sans-serif; 
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0b0c0e;
            color: white;
            overflow: hidden;
            /* پاراستنا کەنارێن شاشا تەلەڤزیۆنێ */
            padding: 10px;
        }
        
        .main-card {
            width: 100%;
            height: 100%;
            background: #141619;
            border: 2px solid #00e6c3;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* بەشێ سەری (Header) - ڕوون ل سەر تەلەڤزیۆنێ */
        .header-box {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: #ffffff;
            border-radius: 6px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
            flex-shrink: 0;
            margin-bottom: 6px;
        }
        .main-title { 
            font-size: 17px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
        }
        .teacher-badge {
            background: #000000;
            color: #ffc107;
            font-size: 17px;
            font-weight: 900;
            padding: 2px 16px;
            border-radius: 20px;
        }

        /* شاشێن مامۆستایان */
        .teacher-screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            height: calc(100% - 48px);
            flex-direction: column;
        }
        .teacher-screen.active {
            display: flex;
            opacity: 1;
        }

        /* بەشێ تۆڕا ناڤان (Grid) - 4 ستوون کەتوار */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px 8px;
            height: 100%;
            width: 100%;
        }

        /* شاشا عمر: 72 ناڤ - 18 ڕێز */
        #gridOmar {
            grid-template-rows: repeat(18, 1fr);
            grid-auto-flow: column;
        }

        /* شاشا پەروەر: 101 ناڤ - 26 ڕێز */
        #gridParwar {
            grid-template-rows: repeat(26, 1fr);
            grid-auto-flow: column;
        }

        /* خانەیا ناڤێن قوتابیان - مەزن و ڕوون بۆ ژ دوور ڤە خواندنێ */
        .student-row {
            background: #1e2126;
            border: 1px solid #2d323b;
            padding: 0 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            height: 100%;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }

        .student-index {
            color: #ffc107;
            font-size: 13px;
            font-weight: 900;
            min-width: 22px;
        }

        .student-name {
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
        }

        /* نمرە چەسپایە ب ناڤی ڤە ب دیزاینەکا جوان */
        .badge {
            background: #00e6c3;
            color: #000000;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 900;
            margin-right: 4px;
            flex-shrink: 0;
        }
    </style>
</head>
